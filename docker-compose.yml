services:
  api:
    build: .
    container_name: linkedin-profile-api
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      HEADLESS: "true"
      LINKEDIN_STATE_PATH: storage/linkedin-state.json
      # Tune as needed:
      MAX_CONCURRENT_EXTRACTIONS: "2"
      CACHE_TTL_SECONDS: "3600"
    volumes:
      # Persist the LinkedIn session state (generated by `pnpm linkedin:login`
      # on the host) so the container's authenticated browser can use it.
      - ./storage:/app/storage
    restart: unless-stopped
