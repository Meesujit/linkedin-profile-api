services:
  api:
    build: .
    container_name: linkedin-profile-api
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      # LinkedIn session cookies — inject your own; never commit them.
      LINKEDIN_LI_AT: ""
      LINKEDIN_JSESSIONID: ""
      # Tune as needed:
      MAX_CONCURRENT_EXTRACTIONS: "2"
      CACHE_TTL_SECONDS: "3600"
    restart: unless-stopped
